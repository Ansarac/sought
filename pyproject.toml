[project]
name = "scout"
version = "0.1.0"
description = "Search CLI that survives hostile networks: tiered engine fallback with an explicit audit trail."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7",
    "playwright>=1.49",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.scripts]
scout = "scout.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

# Ship the Claude skill inside the wheel so `uv tool install` alone is enough —
# `scout install-skill` then works with no checkout present.
[tool.hatch.build.targets.wheel.force-include]
"skills/scout/SKILL.md" = "scout/_skill/SKILL.md"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers in this repo
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    # EngineFailure's first positional argument is a status literal, not a
    # message, so EM101/EM102 fire on nearly every raise in engines/.
    "EM101",
    "EM102",
    "ISC001",  # conflicts with the formatter
    "PLC0415", # deliberate lazy imports keep CLI startup fast
    "T201",    # a CLI prints
    "TC003",   # runtime-visible annotations are fine here
    "TRY003",  # diagnostics belong at the raise site here; that is the point
]

[tool.ruff.lint.per-file-ignores]
# Test functions and fixtures are not an API; annotating them is noise.
"**/tests/*" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN401",
    "ARG001",
    "ARG002",
    "D1",
    "EM101",
    "INP001",
    "PLR2004",
    "S101",
    "TRY003",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

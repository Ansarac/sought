<!doctype html>
<!--
  What a TLS-inspecting corporate proxy answers with when it refuses a request:
  HTTP 200, a perfectly valid page, zero search results. Nothing in the status
  line distinguishes this from "nothing matched", which is why the body has to
  be classified.
-->
<html lang="en">
<head><title>Access Denied</title></head>
<body>
<h1>Access Denied</h1>
<p>
  Access to the requested resource has been blocked by the network security
  policy. If you believe this is an error, contact the service desk and quote
  reference 0x8004A21F.
</p>
<p>Category: <b>Search Engines</b> &mdash; URL: https://old-search.marginalia.nu/search</p>
</body>
</html>
